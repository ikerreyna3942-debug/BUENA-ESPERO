[theme]
base="dark"
primaryColor="#38bdf8"
backgroundColor="#1E293B"
secondaryBackgroundColor="#283548"
textColor="#FFFFFF"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = true
maxMessageSize = 200

[runner]
fastReruns = true

[browser]
gatherUsageStats = false
