name: CI — Buena Espero Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

jobs:
  verify:
    name: Syntax, Unit & GEMINI.md Contract Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & AST validation (all Python files)
        run: |
          python - <<'EOF'
          import ast, pathlib, py_compile
          files = sorted(p for p in pathlib.Path(".").rglob("*.py") if ".git" not in p.parts)
          assert files, "No Python files found"
          for p in files:
              ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
              py_compile.compile(str(p), doraise=True)
          print(f"Syntax/AST OK across {len(files)} files.")
          EOF

      - name: Run V6 tests (test_unified.py)
        run: python tests/test_unified.py

      - name: Run V7 tests (test_v7.py)
        run: python tests/test_v7.py

      - name: Run V8 tests (test_v8.py)
        run: python -m unittest tests/test_v8.py -v

      - name: Run GEMINI.md contract tests
        run: python -m unittest tests/test_gemini_contract.py -v

      - name: Run observability tests
        run: python -m unittest tests/test_observability.py -v
